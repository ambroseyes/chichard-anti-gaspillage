services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chichard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chichard}
      POSTGRES_DB: chichard
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chichard']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'

  api:
    build: ./server
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql://chichard:${POSTGRES_PASSWORD:-chichard}@db:5432/chichard
    depends_on:
      db:
        condition: service_healthy
    # Les migrations sont appliquées au démarrage, avant d'accepter du trafic.
    command: sh -c "npx prisma migrate deploy && node src/server.js"
    ports:
      - '4000:4000'
    volumes:
      - uploads:/app/var/uploads

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    depends_on:
      - api
    ports:
      - '8080:8080'

volumes:
  db-data:
  uploads:
