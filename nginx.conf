server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Application à page unique : toute route inconnue rend index.html, et
    # c'est le routeur qui décide (y compris le 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers du build portent une empreinte dans leur nom : ils peuvent
    # être mis en cache indéfiniment. index.html, non.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
